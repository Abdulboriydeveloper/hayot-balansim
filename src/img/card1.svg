<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9ff" rx="16"/>
  
  <!-- Main book/curriculum document -->
  <rect x="80" y="40" width="160" height="210" fill="#fff" rx="10" stroke="#e0e4ff" stroke-width="2"/>
  <rect x="80" y="40" width="160" height="36" fill="#4f46e5" rx="10"/>
  <rect x="80" y="66" width="160" height="10" fill="#4f46e5" rx="0"/>
  
  <!-- Book lines -->
  <rect x="100" y="95" width="120" height="8" fill="#e0e4ff" rx="4"/>
  <rect x="100" y="112" width="100" height="8" fill="#e0e4ff" rx="4"/>
  <rect x="100" y="129" width="115" height="8" fill="#e0e4ff" rx="4"/>
  <rect x="100" y="146" width="90" height="8" fill="#e0e4ff" rx="4"/>
  <rect x="100" y="163" width="110" height="8" fill="#e0e4ff" rx="4"/>
  <rect x="100" y="180" width="95" height="8" fill="#e0e4ff" rx="4"/>
  <rect x="100" y="197" width="105" height="8" fill="#e0e4ff" rx="4"/>
  <rect x="100" y="214" width="80" height="8" fill="#e0e4ff" rx="4"/>
  
  <!-- Checkmarks -->
  <circle cx="96" cy="99" r="5" fill="#22c55e"/>
  <text x="93" y="103" fill="white" font-size="8" font-weight="bold">✓</text>
  <circle cx="96" cy="116" r="5" fill="#22c55e"/>
  <text x="93" y="120" fill="white" font-size="8" font-weight="bold">✓</text>
  <circle cx="96" cy="133" r="5" fill="#f59e0b"/>
  <circle cx="96" cy="150" r="5" fill="#e5e7eb"/>
  <circle cx="96" cy="167" r="5" fill="#e5e7eb"/>
  
  <!-- Star decoration -->
  <text x="260" y="80" font-size="42" opacity="0.15">📋</text>
  
  <!-- Right side decorative page -->
  <rect x="255" y="60" width="120" height="160" fill="#fff" rx="8" stroke="#e0e4ff" stroke-width="1.5" transform="rotate(8, 315, 140)"/>
  <rect x="268" y="85" width="88" height="6" fill="#e0e4ff" rx="3" transform="rotate(8, 315, 140)"/>
  <rect x="268" y="99" width="70" height="6" fill="#e0e4ff" rx="3" transform="rotate(8, 315, 140)"/>
  <rect x="268" y="113" width="80" height="6" fill="#e0e4ff" rx="3" transform="rotate(8, 315, 140)"/>

  <!-- Bottom label -->
  <rect x="120" y="262" width="160" height="26" fill="#4f46e5" rx="13"/>
  <text x="200" y="280" text-anchor="middle" fill="white" font-size="13" font-family="Inter, sans-serif" font-weight="600">Kurs dasturi</text>
</svg>
