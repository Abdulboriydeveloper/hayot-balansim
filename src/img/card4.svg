<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f9ff" rx="16"/>

  <!-- Chart background grid -->
  <line x1="60" y1="240" x2="360" y2="240" stroke="#e0f2fe" stroke-width="1.5"/>
  <line x1="60" y1="200" x2="360" y2="200" stroke="#e0f2fe" stroke-width="1.5"/>
  <line x1="60" y1="160" x2="360" y2="160" stroke="#e0f2fe" stroke-width="1.5"/>
  <line x1="60" y1="120" x2="360" y2="120" stroke="#e0f2fe" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="360" y2="80" stroke="#e0f2fe" stroke-width="1.5"/>

  <!-- Chart bars - 50 ta yo'nalish themed -->
  <rect x="75"  y="180" width="28" height="60" fill="#3b82f6" rx="5" opacity="0.7"/>
  <rect x="112" y="155" width="28" height="85" fill="#3b82f6" rx="5" opacity="0.8"/>
  <rect x="149" y="130" width="28" height="110" fill="#3b82f6" rx="5" opacity="0.85"/>
  <rect x="186" y="105" width="28" height="135" fill="#3b82f6" rx="5" opacity="0.9"/>
  <rect x="223" y="85"  width="28" height="155" fill="#0ea5e9" rx="5"/>
  <rect x="260" y="70"  width="28" height="170" fill="#0ea5e9" rx="5"/>
  <rect x="297" y="55"  width="28" height="185" fill="#0284c7" rx="5"/>

  <!-- Growth arrow -->
  <path d="M70 230 Q120 210 160 190 Q210 165 260 130 Q300 100 340 65" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="340,65 328,72 335,55" fill="#22c55e"/>

  <!-- 50 badge -->
  <circle cx="200" cy="42" r="32" fill="#1d4ed8"/>
  <text x="200" y="38" text-anchor="middle" fill="white" font-size="22" font-family="Inter,sans-serif" font-weight="900">50</text>
  <text x="200" y="56" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="Inter,sans-serif" font-weight="600">ta yo'nalish</text>

  <!-- Dollar icons -->
  <text x="340" y="268" font-size="24">💰</text>
  <text x="50"  y="58"  font-size="22">📈</text>
</svg>
