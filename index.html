  <!-- AMO FORM POPUP FIX -->
<script>
  const observer = new MutationObserver(() => {
    const iframe = document.querySelector("iframe.amoforms_iframe");

    if (iframe && !document.querySelector(".amo-overlay")) {
      const overlay = document.createElement("div");
      overlay.className = "amo-overlay";

      overlay.onclick = () => {
        iframe.remove();
        overlay.remove();
      };

      document.body.appendChild(overlay);
    }
  });

  observer.observe(document.body, { childList: true });
</script>
</body>

    <div id="root"></div>

  </body>
