<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umidjon Hudoyberdiev - oldindan ro'yxatdan o'tish</title>
    <link rel="preconnect" href="https://forms.amocrm.ru" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      /* Overlay - qoraygan joy */
      #amoOverlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        z-index: 999999;
        align-items: center;
        justify-content: center;
      }
      
      #amoOverlay.active {
        display: flex;
      }
      
      /* Forma qutisi - MUHIM: position: relative bo'lishi kerak */
      .amo-box {
        background: white;
        border-radius: 24px;
        position: relative;  /* BU JUDA MUHIM - close tugmasi uchun */
        width: 510px;
        height: 565px;  /* Biroz balandroq */
        box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        overflow: hidden;  /* Forma to'lib ketmasligi uchun */
        display: flex;
        flex-direction: column;
        margin-bottom: 70px;
      }
      
      /* Forma ichidagi kontent */
      .amo-content {
        padding: 22px 25px 25px;  /* Yuqorida close tugmasi uchun joy */
        flex: 1;
        overflow-y: auto;
        height: 100%;
      }
      
      /* CLOSE TUGMASI - to'g'ri joylashishi uchun */
      #amoCloseBtn {
        position: absolute;
        top: 15px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #ec3737 !important;
        border: 2px solid white !important;
        color: white !important;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000000 !important;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        line-height: 1;
      }
      
      #amoCloseBtn:hover {
        background: #c72a2a !important;
        transform: scale(1.1);
      }
      
      /* Sarlavha */
      .amo-title {
        font-size: 24px;
        font-weight: 700;
        color: #000;
        text-align: center;
        margin-bottom: 20px;
      }
      
      /* Yuklanish */
      .amo-loading {
        text-align: center;
        padding: 60px 20px;
      }
      
      .amo-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #ec3737;
        border-radius: 50%;
        margin: 0 auto 20px;
        animation: spin 1s linear infinite;
      }
      
      .amo-loading p {
        color: #666;
        font-size: 16px;
      }
      
      /* amoCRM form */
      #amoforms_1676490 {
        width: 100%;
        min-height: 400px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Mobil */
      @media (max-width: 600px) {
        .amo-box {
          width: 95%;
          height: 500px;
        }
        .amo-content {
          padding: 45px 20px 20px;
        }
        .amo-title {
          font-size: 20px;
        }
        #amoCloseBtn {
          top: 12px;
          right: 15px;
          width: 40px;
          height: 40px;
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- To'g'ridan-to'g'ri amoCRM formasi -->
    <div id="amoOverlay">
      <div class="amo-box">
        <button id="amoCloseBtn">✕</button>
        
        <div class="amo-content">
          <div class="amo-title">Ro'yxatdan o'tish</div>
          
          <div id="amoLoading" class="amo-loading">
            <div class="amo-spinner"></div>
            <p>Forma yuklanmoqda...</p>
          </div>
          
          <div id="amoforms_1676490"></div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        const overlay = document.getElementById('amoOverlay');
        const closeBtn = document.getElementById('amoCloseBtn');
        const loading = document.getElementById('amoLoading');
        
        // OCHISH
        window.openAmoForm = function() {
          console.log('📢 Forma ochilmoqda');
          overlay.classList.add('active');
          document.body.style.overflow = 'hidden';
          
          if (!window.amoLoaded) {
            loadAmoForm();
          } else {
            loading.style.display = 'none';
          }
        };
        
        // YOPISH
        function closeAmoForm() {
          console.log('🔒 Forma yopilmoqda');
          overlay.classList.remove('active');
          document.body.style.overflow = '';
        }
        
        // Close tugmasi
        if (closeBtn) {
          closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            closeAmoForm();
          });
        }
        
        // Overlay (qora joy)
        if (overlay) {
          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
              closeAmoForm();
            }
          });
        }
        
        // ESC tugmasi
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && overlay.classList.contains('active')) {
            closeAmoForm();
          }
        });
        
        // amoCRM yuklash
        function loadAmoForm() {
          console.log('⏳ Yuklanmoqda...');
          
          // Tozalash
          document.querySelectorAll('script[src*="amoforms"], script[id*="amo"]').forEach(s => s.remove());
          
          // Konfiguratsiya
          const s1 = document.createElement('script');
          s1.innerHTML = `!function(a,m,o,c,r,m){a[o+c]=a[o+c]||{setMeta:function(p){this.params=(this.params||[]).concat([p])}},a[o+r]=a[o+r]||function(f){a[o+r].f=(a[o+r].f||[]).concat([f])},a[o+r]({id:"1676490",hash:"f09e3d886b18ad916f5e64433d629247",locale:"ru"}),a[o+m]=a[o+m]||function(f,k){a[o+m].f=(a[o+m].f||[]).concat([[f,k]])}}(window,0,"amo_forms_","params","load","loaded");`;
          document.body.appendChild(s1);
          
          // Asosiy skript
          const s2 = document.createElement('script');
          s2.src = "https://forms.amocrm.ru/forms/assets/js/amoforms.js?t=" + Date.now();
          s2.async = true;
          
          s2.onload = function() {
            console.log('✅ Yuklandi');
            window.amoLoaded = true;
            loading.style.display = 'none';
          };
          
          s2.onerror = function() {
            console.error('❌ Yuklanmadi');
            loading.innerHTML = '<p style="color: #e74c3c">Xatolik. Qayta urinib ko\'ring.</p>';
          };
          
          document.body.appendChild(s2);
        }
      })();
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
