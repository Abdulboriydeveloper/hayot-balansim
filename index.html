<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umidjon Hudoyberdiev - oldindan ro'yxatdan o'tish</title>
    <link rel="preconnect" href="https://forms.amocrm.ru" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Popup - HTMLda mavjud lekin ko'rinmaydi -->
    <div id="popup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999999; align-items: center; justify-content: center;">
      <div style="background: white; width: 90%; max-width: 500px; border-radius: 20px; padding: 30px; position: relative;">
        <button id="closePopupBtn" style="position: absolute; top: 10px; right: 15px; border: none; background: none; font-size: 24px; cursor: pointer;">✕</button>
        <h3 style="font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 20px;">Ro'yxatdan o'tish</h3>
        <div id="loading" style="text-align: center; padding: 40px;">
          <div style="width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #ec3737; border-radius: 50%; margin: 0 auto 15px; animation: spin 1s linear infinite;"></div>
          <p>Forma yuklanmoqda...</p>
        </div>
        <div id="amoforms_1676490"></div>
      </div>
    </div>

    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script>
      // Popupni boshqarish
      const popup = document.getElementById('popup');
      const closeBtn = document.getElementById('closePopupBtn');
      
      // Ochish funksiyasi - FAQAT tugma bosilganda ishlaydi
      window.openPopup = function() {
        console.log('Opening popup');
        popup.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        
        // Formani yuklash (faqat bir marta)
        if (!window.formLoaded) {
          loadForm();
        }
      };
      
      // Yopish funksiyasi
      function closePopup() {
        console.log('Closing popup');
        popup.style.display = 'none';
        document.body.style.overflow = '';
      }
      
      closeBtn.onclick = closePopup;
      
      // Overlayni bosganda yopish
      popup.onclick = function(e) {
        if (e.target === popup) closePopup();
      };
      
      // ESC tugmasi
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && popup.style.display === 'flex') {
          closePopup();
        }
      });
      
      // Formani yuklash
      function loadForm() {
        console.log('Loading form...');
        
        // Konfiguratsiya
        const script1 = document.createElement('script');
        script1.innerHTML = `!function(a,m,o,c,r,m){a[o+c]=a[o+c]||{setMeta:function(p){this.params=(this.params||[]).concat([p])}},a[o+r]=a[o+r]||function(f){a[o+r].f=(a[o+r].f||[]).concat([f])},a[o+r]({id:"1676490",hash:"f09e3d886b18ad916f5e64433d629247",locale:"ru"}),a[o+m]=a[o+m]||function(f,k){a[o+m].f=(a[o+m].f||[]).concat([[f,k]])}}(window,0,"amo_forms_","params","load","loaded");`;
        document.body.appendChild(script1);
        
        // Asosiy skript
        const script2 = document.createElement('script');
        script2.src = 'https://forms.amocrm.ru/forms/assets/js/amoforms.js?t=' + Date.now();
        script2.async = true;
        
        script2.onload = function() {
          console.log('Form loaded');
          window.formLoaded = true;
          document.getElementById('loading').style.display = 'none';
        };
        
        document.body.appendChild(script2);
      }
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
