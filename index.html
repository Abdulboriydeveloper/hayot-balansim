<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umidjon Hudoyberdiev - oldindan ro'yxatdan o'tish</title>
    <link rel="preconnect" href="https://forms.amocrm.ru" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      /* Forma overlay - faqat forma uchun */
      .amo-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 999999;
        align-items: center;
        justify-content: center;
      }
      
      .amo-overlay.active {
        display: flex;
      }
      
      /* Forma container */
      .amo-container {
        background-color: white;
        width: 90%;
        max-width: 500px;
        border-radius: 24px;
        padding: 25px;
        position: relative;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        max-height: 90vh;
        overflow-y: auto;
      }
      
      /* Close tugmasi - aniq ko'rinadi */
      .amo-close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: #f0f0f0;
        border: none;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
        transition: all 0.2s;
        z-index: 100;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      
      .amo-close-btn:hover {
        background-color: #e0e0e0;
        transform: scale(1.1);
      }
      
      /* Sarlavha */
      .amo-title {
        font-size: 22px;
        font-weight: 700;
        color: #000;
        text-align: center;
        margin-bottom: 20px;
        margin-top: 5px;
        padding-right: 30px;
      }
      
      /* Yuklanish animatsiyasi */
      .amo-loading {
        text-align: center;
        padding: 40px 20px;
      }
      
      .amo-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #f0f0f0;
        border-top: 4px solid #ec3737;
        border-radius: 50%;
        margin: 0 auto 20px;
        animation: spin 1s linear infinite;
      }
      
      .amo-loading p {
        color: #666;
        font-size: 16px;
      }
      
      /* amoCRM form */
      #amoforms_1676490 {
        min-height: 350px;
        width: 100%;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Mobil */
      @media (max-width: 480px) {
        .amo-container {
          padding: 20px 15px;
        }
        .amo-title {
          font-size: 18px;
          margin-bottom: 15px;
        }
        .amo-close-btn {
          top: 10px;
          right: 15px;
          width: 36px;
          height: 36px;
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- To'g'ridan-to'g'ri amoCRM formasi uchun overlay -->
    <div id="amoOverlay" class="amo-overlay">
      <div class="amo-container">
        <button id="amoCloseBtn" class="amo-close-btn">✕</button>
        <h3 class="amo-title">Ro'yxatdan o'tish</h3>
        
        <div id="amoLoading" class="amo-loading">
          <div class="amo-spinner"></div>
          <p>Forma yuklanmoqda...</p>
        </div>
        
        <div id="amoforms_1676490"></div>
      </div>
    </div>

    <script>
      (function() {
        const overlay = document.getElementById('amoOverlay');
        const closeBtn = document.getElementById('amoCloseBtn');
        const loading = document.getElementById('amoLoading');
        const formContainer = document.getElementById('amoforms_1676490');
        
        // FORMA OCHISH - tugma bosilganda
        window.openAmoForm = function() {
          console.log('📢 Forma ochilmoqda');
          overlay.classList.add('active');
          document.body.style.overflow = 'hidden';
          
          // Formani yuklash (faqat bir marta)
          if (!window.amoFormLoaded) {
            loadAmoForm();
          } else {
            // Forma allaqachon yuklangan
            loading.style.display = 'none';
          }
        };
        
        // FORMA YOPISH - close tugmasi yoki qora joy bosilganda
        function closeAmoForm() {
          console.log('🔒 Forma yopilmoqda');
          overlay.classList.remove('active');
          document.body.style.overflow = '';
        }
        
        // Close tugmasi
        if (closeBtn) {
          closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            closeAmoForm();
          });
        }
        
        // Qora joyga bosilganda (overlay)
        if (overlay) {
          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
              closeAmoForm();
            }
          });
        }
        
        // ESC tugmasi
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && overlay.classList.contains('active')) {
            closeAmoForm();
          }
        });
        
        // amoCRM formani yuklash
        function loadAmoForm() {
          console.log('⏳ amoCRM yuklanmoqda...');
          
          // Eski skriptlarni tozalash
          document.querySelectorAll('script[src*="amoforms"], script[id*="amo"]').forEach(s => s.remove());
          
          // Konfiguratsiya skripti
          const configScript = document.createElement('script');
          configScript.innerHTML = `!function(a,m,o,c,r,m){a[o+c]=a[o+c]||{setMeta:function(p){this.params=(this.params||[]).concat([p])}},a[o+r]=a[o+r]||function(f){a[o+r].f=(a[o+r].f||[]).concat([f])},a[o+r]({id:"1676490",hash:"f09e3d886b18ad916f5e64433d629247",locale:"ru"}),a[o+m]=a[o+m]||function(f,k){a[o+m].f=(a[o+m].f||[]).concat([[f,k]])}}(window,0,"amo_forms_","params","load","loaded");`;
          document.body.appendChild(configScript);
          
          // Asosiy skript
          const formScript = document.createElement('script');
          formScript.src = "https://forms.amocrm.ru/forms/assets/js/amoforms.js?t=" + Date.now();
          formScript.async = true;
          
          formScript.onload = function() {
            console.log('✅ amoCRM yuklandi');
            window.amoFormLoaded = true;
            loading.style.display = 'none';
          };
          
          formScript.onerror = function() {
            console.error('❌ Yuklanmadi');
            loading.innerHTML = '<p style="color: #e74c3c">Xatolik. Qayta urinib ko\'ring.</p>';
          };
          
          document.body.appendChild(formScript);
        }
        
        console.log('✅ Tizim tayyor');
      })();
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
