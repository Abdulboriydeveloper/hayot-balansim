<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umidjon Hudoyberdiev - oldindan ro'yxatdan o'tish</title>

    <!-- amoCRM serveriga oldindan ulanish (tezlik uchun) -->
    <link rel="preconnect" href="https://forms.amocrm.ru" />
    <link rel="dns-prefetch" href="https://forms.amocrm.ru" />

    <style>
      /* Popup overlay */
      #amo-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.82);
        backdrop-filter: blur(3px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        padding: 16px;
      }
      #amo-overlay.open {
        display: flex;
      }
      /* Popup box */
      #amo-popup {
        background: #fff;
        width: 100%;
        max-width: 500px;
        border-radius: 22px;
        padding: 44px 28px 28px;
        position: relative;
        animation: amoPopIn 0.22s cubic-bezier(0.16,1,0.3,1);
        min-height: 200px;
      }
      @keyframes amoPopIn {
        from { opacity: 0; transform: scale(0.93) translateY(12px); }
        to   { opacity: 1; transform: scale(1)   translateY(0); }
      }
      /* Yopish tugmasi */
      #amo-close {
        position: absolute;
        top: 12px; right: 14px;
        width: 34px; height: 34px;
        border-radius: 50%;
        border: none;
        background: #f0f0f0;
        color: #555;
        font-size: 18px;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.15s;
        line-height: 1;
      }
      #amo-close:hover { background: #e0e0e0; color: #000; }
      /* Yuklanmoqda */
      #amo-loader {
        text-align: center;
        padding: 30px 0 10px;
        color: #888;
        font-family: Inter, sans-serif;
        font-size: 15px;
      }
      .amo-spinner {
        width: 36px; height: 36px;
        border: 3px solid #f0f0f0;
        border-top-color: #e8b84b;
        border-radius: 50%;
        margin: 0 auto 12px;
        animation: amoSpin 0.8s linear infinite;
      }
      @keyframes amoSpin {
        to { transform: rotate(360deg); }
      }
      /* Mobile */
      @media (max-width: 520px) {
        #amo-popup {
          border-radius: 18px;
          padding: 40px 16px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- POPUP (boshlang'ichda yopiq, JS boshqaradi) -->
    <div id="amo-overlay">
      <div id="amo-popup">
        <button id="amo-close">✕</button>
        <div id="amo-loader">
          <div class="amo-spinner"></div>
          <p>Forma yuklanmoqda...</p>
        </div>
        <!-- amoCRM forma shu yerga yuklanadi -->
        <div id="amoforms_1676490"></div>
      </div>
    </div>

    <script>
      (function () {
        var overlay  = document.getElementById("amo-overlay");
        var loader   = document.getElementById("amo-loader");
        var formDiv  = document.getElementById("amoforms_1676490");

        var formLoaded  = false;
        var formLoading = false;

        /* ── YOPISH ── */
        function closePopup() {
          overlay.classList.remove("open");
          document.body.style.overflow = "";
        }

        document.getElementById("amo-close").onclick = closePopup;
        overlay.onclick = function(e) { if (e.target === overlay) closePopup(); };
        document.addEventListener("keydown", function(e) {
          if (e.key === "Escape" && overlay.classList.contains("open")) closePopup();
        });

        /* ── amoCRM SKRIPTINI YUKLASH ── */
        function loadForm() {
          if (formLoading) return;
          formLoading = true;

          // Init
          var init  = document.createElement("script");
          init.text = '!function(a,m,o,c,r,m){a[o+c]=a[o+c]||{setMeta:function(p){this.params=(this.params||[]).concat([p])}},a[o+r]=a[o+r]||function(f){a[o+r].f=(a[o+r].f||[]).concat([f])},a[o+r]({id:"1676490",hash:"f09e3d886b18ad916f5e64433d629247",locale:"ru"}),a[o+m]=a[o+m]||function(f,k){a[o+m].f=(a[o+m].f||[]).concat([[f,k]])}}(window,0,"amo_forms_","params","load","loaded");';
          document.body.appendChild(init);

          // Core — URL sabit (kesh ishlashi uchun, Date.now() YO'Q)
          var core     = document.createElement("script");
          core.async   = true;
          core.charset = "utf-8";
          core.src     = "https://forms.amocrm.ru/forms/assets/js/amoforms.js";

          core.onload = function() {
            formLoaded  = true;
            formLoading = false;
            loader.style.display = "none";
          };

          core.onerror = function() {
            formLoading = false;
            loader.innerHTML = "<p style='color:#e53;font-family:Inter,sans-serif'>Xatolik yuz berdi. Sahifani qayta yuklang.</p>";
          };

          document.body.appendChild(core);
        }

        /* ── OCHISH (tugma bosilganda chaqiriladi) ── */
        window._openAmoForm = function() {
          // Allaqachon ochiqmi? Qayta ochma
          if (overlay.classList.contains("open")) return;

          overlay.classList.add("open");
          document.body.style.overflow = "hidden";

          // Forma hali yuklanmagan bo'lsa — yukla
          if (!formLoaded && !formLoading) {
            loadForm();
          }
        };

      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
