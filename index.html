<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umidjon Hudoyberdiev - oldindan ro'yxatdan o'tish</title>
    <link rel="preconnect" href="https://forms.amocrm.ru" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      /* Popup overlay */
      .popup-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 999999;
        align-items: center;
        justify-content: center;
      }
      
      .popup-overlay.active {
        display: flex;
      }
      
      /* Popup container */
      .popup-container {
        background-color: #ffffff;
        width: 90%;
        max-width: 520px;
        border-radius: 28px;
        padding: 35px 30px 30px;
        position: relative;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        animation: popupFadeIn 0.25s ease-out;
        max-height: 90vh;
        overflow-y: auto;
      }
      
      /* Close tugmasi */
      .popup-close {
        position: absolute;
        top: 15px;
        right: 20px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background-color: #f0f0f0;
        border: none;
        font-size: 26px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
        transition: all 0.2s;
        z-index: 100;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      
      .popup-close:hover {
        background-color: #e0e0e0;
        transform: scale(1.1);
        color: #000;
      }
      
      .popup-title {
        font-size: 24px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: center;
        margin-bottom: 25px;
        padding-right: 30px;
        line-height: 1.3;
      }
      
      /* Loading animatsiyasi */
      .popup-loading {
        text-align: center;
        padding: 50px 20px;
      }
      
      .popup-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #ec3737;
        border-radius: 50%;
        margin: 0 auto 20px;
        animation: spin 1s linear infinite;
      }
      
      .popup-loading p {
        color: #666;
        font-size: 16px;
      }
      
      /* Form container */
      #amoforms_1676490 {
        min-height: 350px;
        width: 100%;
        margin-top: 10px;
      }
      
      @keyframes popupFadeIn {
        from {
          opacity: 0;
          transform: scale(0.92) translateY(15px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @media (max-width: 600px) {
        .popup-container {
          padding: 30px 20px 25px;
          width: 95%;
        }
        .popup-title {
          font-size: 20px;
        }
        .popup-close {
          top: 12px;
          right: 15px;
          width: 38px;
          height: 38px;
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Popup -->
    <div id="popupOverlay" class="popup-overlay">
      <div class="popup-container">
        <button id="popupCloseBtn" class="popup-close">✕</button>
        <h3 class="popup-title">Ro'yxatdan o'tish</h3>
        
        <div id="popupLoading" class="popup-loading">
          <div class="popup-spinner"></div>
          <p>Forma yuklanmoqda...</p>
        </div>
        
        <div id="amoforms_1676490"></div>
      </div>
    </div>

    <script>
      (function() {
        const overlay = document.getElementById('popupOverlay');
        const closeBtn = document.getElementById('popupCloseBtn');
        const loading = document.getElementById('popupLoading');
        const formContainer = document.getElementById('amoforms_1676490');
        
        // Popup ochish
        window.openPopup = function() {
          console.log('📢 Opening popup');
          overlay.classList.add('active');
          document.body.style.overflow = 'hidden';
          
          if (!window.amoFormLoaded) {
            loadAmoForm();
          } else {
            // Forma allaqachon yuklangan
            loading.style.display = 'none';
          }
        };
        
        // Popup yopish - FORMA BUTUNLAY YO'QOLADI
        function closePopup() {
          console.log('🔒 Closing popup');
          
          // Formani butunlay tozalash
          if (formContainer) {
            formContainer.innerHTML = '';
          }
          
          // amoCRM global obyektlarini tozalash
          delete window.amo_forms_params;
          delete window.amo_forms_load;
          delete window.amo_forms_loaded;
          
          // Eski skriptlarni o'chirish
          document.querySelectorAll('script[src*="amoforms"], script[id*="amo"]').forEach(s => s.remove());
          
          // Yuklanganlik flagini reset qilish
          window.amoFormLoaded = false;
          
          // Loading ni qayta ko'rsatish
          loading.style.display = 'block';
          
          // Popupni yopish
          overlay.classList.remove('active');
          document.body.style.overflow = '';
        }
        
        // Close tugmasi
        if (closeBtn) {
          closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            closePopup();
          });
        }
        
        // Overlay bosilganda
        if (overlay) {
          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
              closePopup();
            }
          });
        }
        
        // ESC tugmasi
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && overlay.classList.contains('active')) {
            closePopup();
          }
        });
        
        // amoCRM formani yuklash
        function loadAmoForm() {
          console.log('⏳ Loading amoCRM form...');
          
          // Eski skriptlarni tozalash
          document.querySelectorAll('script[src*="amoforms"], script[id*="amo"]').forEach(s => s.remove());
          
          // Form container ni tozalash
          if (formContainer) {
            formContainer.innerHTML = '';
          }
          
          // Konfiguratsiya skripti
          const configScript = document.createElement('script');
          configScript.innerHTML = `!function(a,m,o,c,r,m){a[o+c]=a[o+c]||{setMeta:function(p){this.params=(this.params||[]).concat([p])}},a[o+r]=a[o+r]||function(f){a[o+r].f=(a[o+r].f||[]).concat([f])},a[o+r]({id:"1676490",hash:"f09e3d886b18ad916f5e64433d629247",locale:"ru"}),a[o+m]=a[o+m]||function(f,k){a[o+m].f=(a[o+m].f||[]).concat([[f,k]])}}(window,0,"amo_forms_","params","load","loaded");`;
          document.body.appendChild(configScript);
          
          // Asosiy form skripti
          const formScript = document.createElement('script');
          formScript.id = "amoforms_script_1676490";
          formScript.async = true;
          formScript.charset = "utf-8";
          formScript.src = "https://forms.amocrm.ru/forms/assets/js/amoforms.js?t=" + Date.now();
          
          formScript.onload = function() {
            console.log('✅ amoCRM form loaded');
            window.amoFormLoaded = true;
            loading.style.display = 'none';
          };
          
          formScript.onerror = function() {
            console.error('❌ Failed to load form');
            loading.innerHTML = '<p style="color: #e74c3c">Xatolik yuz berdi. Qayta urinib ko\'ring.</p>';
          };
          
          document.body.appendChild(formScript);
        }
        
        console.log('✅ Popup ready');
      })();
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
